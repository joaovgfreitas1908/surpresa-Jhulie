<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fff0f5">
  <title>Uma surpresa para você 💕</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="cartao">
    <div class="coracao-topo" aria-hidden="true">💌</div>
    <p class="subtitulo">Uma perguntinha especial...</p>
    <h1 id="pergunta">Quer continuar namorando comigo para sempre? 💖</h1>
    <p id="dica" class="dica">Tenta apertar o “Sim”! 👀</p>

    <div id="arena" class="arena" aria-label="Escolha uma resposta">
      <button id="sim" class="botao botao-sim" type="button">Sim! 💗</button>
      <button id="nao" class="botao botao-nao" type="button">Não 🙈</button>
    </div>

    <section id="resultado" class="resultado" hidden aria-live="polite">
      <div class="coracao-grande" aria-hidden="true">💗</div>
      <h2>Brincadeirinha, meu amor!</h2>
      <p>Eu não fugiria de você nem por um segundo. ❤️</p>
      <p>Você faz meus dias mais felizes, e eu escolheria você de novo, todas as vezes.</p>
      <p class="assinatura">Eu te amo! 💕</p>
    </section>
    <p class="rodape">Feito com muito amor ♡</p>
  </main>
</body>
</html>
